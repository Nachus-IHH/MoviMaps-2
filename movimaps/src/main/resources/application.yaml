# application.yaml
spring:
  application:
    name: movimaps-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect # PostGIS + Hibernate spatial
    hibernate:
      ddl-auto: validate

osrm:
  api:
    url: ${OSRM_URL:http://localhost:5000}
